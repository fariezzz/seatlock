syntax = "proto3";

package bioskop;

service Bioskop {
  rpc PesanKursi (PesanRequest) returns (PesanResponse);
  rpc BatalkanPesanan (BatalRequest) returns (PesanResponse);
  rpc LihatKursi (LihatRequest) returns (LihatResponse);
  rpc StreamingStatusKursi (StatusRequest) returns (stream StatusUpdate);
  rpc DaftarJadwal (DaftarJadwalRequest) returns (DaftarJadwalResponse);
}

message Jadwal {
  string id = 1;      // contoh: "J1"
  string film = 2;    // contoh: "Petualangan Langit"
  string waktu = 3;   // contoh: "14:00"
  string studio = 4;  // contoh: "Studio 1"
}

message Kursi {
  string id = 1;       // contoh: "A3"
  string status = 2;   // "kosong" atau "terpesan"
  string pemesan = 3;  // nama pemesan, kosong jika kursi kosong
}

message PesanRequest {
  string jadwal_id = 1;
  string kursi_id = 2;
  string nama = 3;
  string request_id = 4;  // WAJIB stabil di tiap retry; jangan dibuat ulang.
}

message BatalRequest {
  string jadwal_id = 1;
  string kursi_id = 2;
  string nama = 3;
  string request_id = 4;
  string kode_booking = 5;  // wajib cocok dengan kode saat memesan
}

message PesanResponse {
  bool sukses = 1;
  string pesan = 2;
  Kursi kursi = 3;
  string kode_booking = 4;  // hanya diisi saat pemesanan berhasil
}

message LihatRequest {
  string jadwal_id = 1;  // kosong = jadwal pertama (J1)
}

message LihatResponse {
  repeated Kursi kursi = 1;
  string jadwal_id = 2;
}

message StatusRequest {
  string jadwal_id = 1;  // kosong = jadwal pertama (J1)
}

message StatusUpdate {
  repeated Kursi kursi = 1;
  int64 versi = 2;  // naik setiap ada perubahan status kursi pada jadwal itu
  string jadwal_id = 3;
}

message DaftarJadwalRequest {}

message DaftarJadwalResponse {
  repeated Jadwal jadwal = 1;
}
